<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Anggota - Pengajian</title>
    
    <!-- Library HTML5 QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px; /* Ukuran mobile */
            background-color: var(--card-bg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        .header h2 { margin: 0; font-size: 1.2rem; }
        
        .content { padding: 20px; flex: 1; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem;}
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid #ccc;
            border-radius: 8px; box-sizing: border-box; font-size: 1rem;
        }

        .btn {
            width: 100%; padding: 14px;
            background-color: var(--primary); color: white;
            border: none; border-radius: 8px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-outline {
            background-color: transparent; color: var(--primary);
            border: 2px solid var(--primary);
        }

        /* Tampilan Scanner */
        #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-top: 15px;}
        
        /* Notifikasi */
        .alert {
            padding: 15px; border-radius: 8px; margin-bottom: 15px;
            display: none; text-align: center; font-weight: bold;
        }
        .alert.success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0;}
        .alert.error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca;}
        .alert.loading { background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd;}

        .profile-card {
            background: #f8fafc; border: 1px solid #e2e8f0;
            padding: 15px; border-radius: 8px; margin-bottom: 20px;
        }
        .profile-card h3 { margin: 0 0 5px 0; color: var(--primary); }
        .profile-card p { margin: 0; font-size: 0.9rem; color: #64748b;}
        
        /* Hilangkan bagian UI default html5-qrcode yang jelek */
        #reader__dashboard_section_csr span { color: red !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>Aplikasi Absensi Anggota</h2>
    </div>

    <div class="content">
        <!-- Notifikasi -->
        <div id="alertBox" class="alert"></div>

        <!-- BAGIAN 1: FORM LOGIN / DATA DIRI -->
        <div id="section-login" style="display: none;">
            <h3 style="text-align: center; margin-bottom: 5px;">Selamat Datang!</h3>
            <p style="text-align: center; font-size: 0.9rem; color: #666; margin-bottom: 20px;">Silakan isi data diri Anda di HP ini untuk mulai absen.</p>
            
            <div class="form-group">
                <label>Nama Lengkap (Sesuai KTP/Daftar)</label>
                <input type="text" id="inputNama" placeholder="Contoh: Muhammad Ali">
            </div>
            <div class="form-group">
                <label>Nama Panggilan</label>
                <input type="text" id="inputPanggilan" placeholder="Contoh: Ali">
            </div>
            <div class="form-group">
                <label>Jenis Kelamin</label>
                <select id="inputJK">
                    <option value="L">Laki-Laki (L)</option>
                    <option value="P">Perempuan (P)</option>
                </select>
            </div>
            <button class="btn" onclick="simpanDataDiri()">Simpan & Lanjut</button>
        </div>

        <!-- BAGIAN 2: DASHBOARD & SCANNER -->
        <div id="section-dashboard" style="display: none;">
            <div class="profile-card">
                <h3 id="displayNama">Nama</h3>
                <p id="displayInfo">Laki-Laki</p>
                <a href="#" onclick="editDataDiri()" style="font-size: 0.8rem; color: var(--primary); text-decoration: underline; margin-top: 5px; display: inline-block;">Edit Data Diri</a>
            </div>

            <div id="btnStartScanContainer">
                <button class="btn" onclick="mulaiScan()">📷 Buka Kamera & Scan QR</button>
            </div>

            <div id="scannerContainer" style="display: none;">
                <div id="reader"></div>
                <button class="btn btn-outline" style="margin-top: 15px;" onclick="hentikanScan()">❌ Batal Scan</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ⚠️ PENTING: Ganti dengan SCRIPT URL Anda!
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzMrPVtBHz5Vo50ucH5Mcmt5ubE7Bau-e3VKk0NpyxeJpi5Qf3AGdnmuvZ1CWug1jshfg/exec'; 

    let html5QrCode;
    let dataAnggota = {};

    // 1. CEK STATUS SAAT APLIKASI DIBUKA
    window.onload = function() {
        const savedData = localStorage.getItem('memberData');
        if (savedData) {
            dataAnggota = JSON.parse(savedData);
            tampilkanDashboard();
        } else {
            document.getElementById('section-login').style.display = 'block';
        }
    };

    // 2. FUNGSI SIMPAN DATA DIRI (LOGIN)
    function simpanDataDiri() {
        const nama = document.getElementById('inputNama').value.trim();
        const panggilan = document.getElementById('inputPanggilan').value.trim();
        const jk = document.getElementById('inputJK').value;

        if (!nama) {
            showAlert('error', 'Nama Lengkap wajib diisi!');
            return;
        }

        dataAnggota = { nama, panggilan, jk };
        localStorage.setItem('memberData', JSON.stringify(dataAnggota));
        
        showAlert('success', 'Data tersimpan di HP ini!');
        setTimeout(() => {
            tampilkanDashboard();
        }, 1000);
    }

    function editDataDiri() {
        document.getElementById('inputNama').value = dataAnggota.nama;
        document.getElementById('inputPanggilan').value = dataAnggota.panggilan;
        document.getElementById('inputJK').value = dataAnggota.jk;
        
        document.getElementById('section-dashboard').style.display = 'none';
        document.getElementById('section-login').style.display = 'block';
    }

    function tampilkanDashboard() {
        document.getElementById('section-login').style.display = 'none';
        document.getElementById('section-dashboard').style.display = 'block';
        
        document.getElementById('displayNama').innerText = dataAnggota.nama;
        document.getElementById('displayInfo').innerText = (dataAnggota.jk === 'L' ? 'Laki-Laki' : 'Perempuan') + ' | ' + (dataAnggota.panggilan || '');
        
        hideAlert();
    }

    // 3. FUNGSI SCANNER
    function mulaiScan() {
        document.getElementById('btnStartScanContainer').style.display = 'none';
        document.getElementById('scannerContainer').style.display = 'block';
        
        // Inisialisasi scanner
        html5QrCode = new Html5Qrcode("reader");
        
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        
        // Gunakan kamera belakang (environment)
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch((err) => {
            showAlert('error', 'Gagal mengakses kamera. Pastikan izin kamera diberikan.');
            hentikanScan();
        });
    }

    function hentikanScan() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('scannerContainer').style.display = 'none';
                document.getElementById('btnStartScanContainer').style.display = 'block';
            }).catch(err => console.log(err));
        }
    }

    // 4. JIKA QR BERHASIL DI-SCAN
    function onScanSuccess(decodedText) {
        hentikanScan(); // Matikan kamera
        
        // Cek apakah format QR sesuai format admin (PENGAJIAN|Tanggal|Topik)
        if (!decodedText.startsWith("PENGAJIAN|")) {
            showAlert('error', 'QR Code tidak valid! Pastikan Anda scan QR dari Admin Pengajian.');
            return;
        }

        kirimDataAbsen(decodedText);
    }

    // 5. KIRIM DATA KE GOOGLE APPS SCRIPT
    function kirimDataAbsen(qrContent) {
        showAlert('loading', '⏳ Sedang mengirim data absen...');

        const payload = {
            action: "absen_qr_mandiri",
            nama: dataAnggota.nama,
            panggilan: dataAnggota.panggilan,
            jk: dataAnggota.jk,
            qrContent: qrContent
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Penting untuk melewati CORS error dari Google
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            // Karena no-cors, response tidak bisa dibaca langsung, tapi jika masuk block then() berarti sukses terkirim.
            showAlert('success', `✅ Absen Berhasil!<br>Terima kasih, ${dataAnggota.panggilan || dataAnggota.nama}.`);
        })
        .catch(error => {
            showAlert('error', '❌ Gagal mengirim absen. Periksa koneksi internet Anda.');
            console.error('Error:', error);
        });
    }

    // FUNGSI BANTUAN
    function showAlert(type, text) {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = 'alert ' + type;
        alertBox.innerHTML = text;
        alertBox.style.display = 'block';
    }

    function hideAlert() {
        document.getElementById('alertBox').style.display = 'none';
    }
</script>

</body>
</html>
