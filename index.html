<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Anggota - Pengajian</title>
    
    <!-- Library HTML5 QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            align-items: flex-start;
        }

        .app-container {
            width: 100%;
            max-width: 450px; 
            background-color: var(--card-bg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: 10px;
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 { margin: 0; font-size: 1.3rem; }
        .header p { margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.9; }
        
        .content { padding: 20px; }

        /* Form Styles */
        .flex-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .form-group { flex: 1; margin-bottom: 12px; }
        .flex-row .form-group { margin-bottom: 0; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: #374151;}
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 8px; box-sizing: border-box; font-size: 0.95rem;
        }

        /* Buttons */
        .btn {
            width: 100%; padding: 14px;
            background-color: var(--primary); color: white;
            border: none; border-radius: 8px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .btn-outline {
            background-color: transparent; color: #dc2626;
            border: 2px solid #dc2626;
        }
        .btn-outline:hover { background-color: #fef2f2; }

        /* Scanner */
        #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-top: 15px; border: none; }
        
        /* Notifikasi */
        .alert {
            padding: 12px; border-radius: 8px; margin-bottom: 15px;
            display: none; text-align: center; font-weight: bold; font-size: 0.9rem;
        }
        .alert.success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0;}
        .alert.error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca;}
        .alert.loading { background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd;}

        /* Profile Card Dashboard */
        .profile-card {
            background: #f8fafc; border: 1px solid #e2e8f0;
            padding: 15px; border-radius: 8px; margin-bottom: 20px;
        }
        .profile-card h3 { margin: 0 0 5px 0; color: var(--primary); font-size: 1.1rem; }
        .profile-card p { margin: 3px 0; font-size: 0.85rem; color: #475569;}
        .edit-link { font-size: 0.8rem; color: #2563eb; text-decoration: none; font-weight: bold; margin-top: 8px; display: inline-block; cursor: pointer;}
        .edit-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>🕌 Absensi Pengajian</h2>
        <p>Muda-Mudi Mandiri</p>
    </div>

    <div class="content">
        <!-- Notifikasi -->
        <div id="alertBox" class="alert"></div>

        <!-- HALAMAN 1: FORM LOGIN / REGISTRASI -->
        <div id="section-login" style="display: none;">
            <div style="text-align: center; margin-bottom: 20px;">
                <h3 style="margin: 0 0 5px 0; color: var(--text-color);">Selamat Datang!</h3>
                <p style="margin: 0; font-size: 0.85rem; color: #64748b;">Isi data diri Anda di HP ini untuk mulai absen. Hanya perlu diisi sekali.</p>
            </div>

            <form onsubmit="simpanDataDiri(event)">
                <div class="form-group">
                    <label>Nama Lengkap (Sesuai Daftar)</label>
                    <input type="text" id="inputNama" required placeholder="Contoh: Muhammad Ali">
                </div>

                <div class="flex-row">
                    <div class="form-group">
                        <label>Panggilan</label>
                        <input type="text" id="inputPanggilan" required placeholder="Contoh: Ali">
                    </div>
                    <div class="form-group">
                        <label>Jenis Kelamin</label>
                        <select id="inputJK">
                            <option value="Laki-laki">Laki-Laki (L)</option>
                            <option value="Perempuan">Perempuan (P)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Alamat / Dusun / RT</label>
                    <input type="text" id="inputAlamat" required placeholder="Contoh: Dusun Krajan RT 01">
                </div>

                <div class="flex-row">
                    <div class="form-group">
                        <label>No. WA Anda</label>
                        <input type="tel" id="inputHP" required placeholder="0812xxxx">
                    </div>
                    <div class="form-group">
                        <label>No. HP Orang Tua</label>
                        <input type="tel" id="inputHPOrtu" placeholder="085xxxx (Opsional)">
                    </div>
                </div>

                <button type="submit" id="btnSubmitReg" class="btn">Simpan & Lanjut 🚀</button>
            </form>
        </div>

        <!-- HALAMAN 2: DASHBOARD & SCANNER -->
        <div id="section-dashboard" style="display: none;">
            
            <div class="profile-card">
                <h3 id="displayNama">Nama Lengkap</h3>
                <p>👤 <span id="displayPanggilan">Panggilan</span> | <span id="displayJK">L/P</span></p>
                <p>📍 <span id="displayAlamat">Alamat</span></p>
                <p>📱 WA: <span id="displayHP">08xx</span></p>
                <a onclick="editDataDiri()" class="edit-link">✏️ Edit Data Diri (Ganti Akun)</a>
            </div>

            <div style="text-align: center; margin-bottom: 15px; font-size: 0.9rem; color: #475569;">
                Arahkan kamera ke <b>QR Code Pengurus</b> untuk mengisi kehadiran.
            </div>

            <div id="btnStartScanContainer">
                <button class="btn" onclick="mulaiScan()">📷 Buka Kamera & Scan QR</button>
            </div>

            <div id="scannerContainer" style="display: none;">
                <div id="reader"></div>
                <button class="btn btn-outline" style="margin-top: 15px;" onclick="hentikanScan()">❌ Batal Scan</button>
            </div>
            
        </div>
    </div>
</div>

<script>
    // ⚠️ PENTING: Ganti dengan SCRIPT URL Google Apps Script Anda yang valid!
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzMrPVtBHz5Vo50ucH5Mcmt5ubE7Bau-e3VKk0NpyxeJpi5Qf3AGdnmuvZ1CWug1jshfg/exec'; 

    let html5QrCode;
    let dataAnggota = {};

    // 1. CEK STATUS SAAT APLIKASI DIBUKA
    window.onload = function() {
        const savedData = localStorage.getItem('memberData_pengajian');
        if (savedData) {
            dataAnggota = JSON.parse(savedData);
            tampilkanDashboard();
        } else {
            document.getElementById('section-login').style.display = 'block';
        }
    };

    // 2. FUNGSI SIMPAN DATA DIRI & LANGSUNG KIRIM KE SPREADSHEET (BARU)
    function simpanDataDiri(e) {
        e.preventDefault(); // Mencegah reload halaman
        
        const nama = document.getElementById('inputNama').value.trim();
        const panggilan = document.getElementById('inputPanggilan').value.trim();
        const jk = document.getElementById('inputJK').value;
        const alamat = document.getElementById('inputAlamat').value.trim();
        const hp = document.getElementById('inputHP').value.trim();
        const hportu = document.getElementById('inputHPOrtu').value.trim();

        if (!nama || !alamat || !hp) {
            showAlert('error', 'Nama, Alamat, dan No HP wajib diisi!');
            return;
        }

        // Kumpulkan data ke dalam objek
        dataAnggota = { nama, panggilan, jk, alamat, hp, hportu };
        
        // Payload khusus untuk pendaftaran (action: registrasi_baru)
        const payload = {
            action: "registrasi_baru",
            nama: dataAnggota.nama,
            panggilan: dataAnggota.panggilan,
            jk: dataAnggota.jk,
            alamat: dataAnggota.alamat,
            hp: dataAnggota.hp,
            hportu: dataAnggota.hportu
        };

        const btnSubmit = document.getElementById('btnSubmitReg');
        btnSubmit.innerText = "⏳ Sedang Menyimpan Data...";
        btnSubmit.disabled = true;

        // Kirim data ke Google Sheet
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            // Simpan ke memory lokal HP jika sudah berhasil dikirim
            localStorage.setItem('memberData_pengajian', JSON.stringify(dataAnggota));
            showAlert('success', '✅ Data Berhasil Didaftarkan!');
            
            // Pindah ke Dashboard setelah 1.5 detik
            setTimeout(() => {
                tampilkanDashboard();
                btnSubmit.innerText = "Simpan & Lanjut 🚀";
                btnSubmit.disabled = false;
            }, 1500);
        })
        .catch(error => {
            showAlert('error', '❌ Gagal menyimpan data. Periksa internet Anda.');
            btnSubmit.innerText = "Simpan & Lanjut 🚀";
            btnSubmit.disabled = false;
        });
    }

    // 3. TAMPILKAN HALAMAN DASHBOARD & ISI PROFIL
    function tampilkanDashboard() {
        document.getElementById('section-login').style.display = 'none';
        document.getElementById('section-dashboard').style.display = 'block';

        // Tampilkan info yang sudah disave
        document.getElementById('displayNama').innerText = dataAnggota.nama;
        document.getElementById('displayPanggilan').innerText = dataAnggota.panggilan || '-';
        document.getElementById('displayJK').innerText = dataAnggota.jk;
        document.getElementById('displayAlamat').innerText = dataAnggota.alamat;
        document.getElementById('displayHP').innerText = dataAnggota.hp;
        
        hideAlert();
    }

    // 4. KEMBALI KE FORM UNTUK EDIT DATA
    function editDataDiri() {
        if(confirm("Yakin ingin edit data atau ganti akun?")) {
            document.getElementById('inputNama').value = dataAnggota.nama || '';
            document.getElementById('inputPanggilan').value = dataAnggota.panggilan || '';
            document.getElementById('inputJK').value = dataAnggota.jk || 'Laki-laki';
            document.getElementById('inputAlamat').value = dataAnggota.alamat || '';
            document.getElementById('inputHP').value = dataAnggota.hp || '';
            document.getElementById('inputHPOrtu').value = dataAnggota.hportu || '';

            hentikanScan(); 
            document.getElementById('section-dashboard').style.display = 'none';
            document.getElementById('section-login').style.display = 'block';
        }
    }

    // 5. FUNGSI SCANNER
    function mulaiScan() {
        hideAlert();
        document.getElementById('btnStartScanContainer').style.display = 'none';
        document.getElementById('scannerContainer').style.display = 'block';
        
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch((err) => {
            showAlert('error', 'Gagal mengakses kamera. Pastikan izin kamera diberikan di browser Anda.');
            hentikanScan();
        });
    }

    function hentikanScan() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('scannerContainer').style.display = 'none';
                document.getElementById('btnStartScanContainer').style.display = 'block';
            }).catch(err => console.log("Gagal menghentikan kamera", err));
        }
    }

    // 6. JIKA QR BERHASIL DI-SCAN
    function onScanSuccess(decodedText) {
        hentikanScan(); 
        
        // Pilihan: Jika perlu validasi QR harus berawalan PENGAJIAN|
        if (!decodedText.startsWith("PENGAJIAN|")) {
            showAlert('error', '❌ QR Code tidak valid! Pastikan Anda scan QR dari Admin Pengajian.');
            return;
        }

        kirimDataAbsen(decodedText);
    }

    // 7. KIRIM DATA ABSEN KE GOOGLE APPS SCRIPT
    function kirimDataAbsen(qrContent) {
        showAlert('loading', '⏳ Sedang mengirim data absen...');

        // Payload khusus untuk absensi (action: absen_qr_mandiri)
        const payload = {
            action: "absen_qr_mandiri",
            qrContent: qrContent,
            nama: dataAnggota.nama,
            panggilan: dataAnggota.panggilan,
            jk: dataAnggota.jk,
            alamat: dataAnggota.alamat,
            hp: dataAnggota.hp,
            hportu: dataAnggota.hportu
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            showAlert('success', `✅ Absen Berhasil!<br>Kehadiran atas nama <b>${dataAnggota.panggilan}</b> telah tercatat.`);
        })
        .catch(error => {
            showAlert('error', '❌ Gagal mengirim absen. Periksa koneksi internet Anda.');
            console.error('Fetch Error:', error);
        });
    }

    // FUNGSI BANTUAN
    function showAlert(type, text) {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = 'alert ' + type;
        alertBox.innerHTML = text;
        alertBox.style.display = 'block';
    }

    function hideAlert() {
        document.getElementById('alertBox').style.display = 'none';
    }
</script>

</body>
</html>
